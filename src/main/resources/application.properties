spring.application.name=golden-raspberry-api

spring.datasource.url=jdbc:h2:mem:goldenraspberry
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

app.movies-csv=classpath:Movielist.csv

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Signing key for the self-issued JWTs. Deliberately empty here: set JWT_SECRET in the
# environment to pin it, or leave it unset and a random key is generated on each startup.
app.security.jwt-secret=${JWT_SECRET:}
app.security.user-password=passUser
app.security.admin-password=passAdmin
